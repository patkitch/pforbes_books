<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} | P. Forbes Art</title><style>body{font:16px system-ui,sans-serif;background:#f6f7f9;color:#243449}main{max-width:700px;margin:30px auto;padding:24px;background:#fff;border-radius:11px}label{font-weight:600;display:block;margin:12px 0 5px}input:not([type=checkbox]),select,textarea{width:100%;padding:10px;border:1px solid #bac8d5;border-radius:6px;box-sizing:border-box}button{padding:11px 18px;background:#19516d;color:white;border:0;border-radius:6px}a{color:#19516d}.errorlist{color:#aa2323}</style></head><body><main><h1>{{ title }}</h1><form method="post" {% if has_file %}enctype="multipart/form-data"{% endif %}>{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% endfor %}<p><button type="submit">Save</button> · <a href="{{ back }}">Cancel</a></p></form></main></body></html>
