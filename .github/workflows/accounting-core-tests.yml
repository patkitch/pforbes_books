name: Accounting core isolated tests

on:
  push:
    branches:
      - feature/accounting-foundation
    paths:
      - 'accounting/**'
      - 'accounting_contacts/**'
      - 'accounting_imports/**'
      - 'accounting_profile/**'
      - 'scripts/install_accounting_test.ps1'
      - 'config/settings_accounting_ci.py'
      - 'config/urls_accounting_ci.py'
      - '.github/workflows/accounting-core-tests.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'accounting/**'
      - 'accounting_contacts/**'
      - 'scripts/install_accounting_test.ps1'
      - 'config/settings_accounting_ci.py'
      - 'config/urls_accounting_ci.py'
      - '.github/workflows/accounting-core-tests.yml'

permissions:
  contents: read

jobs:
  accounting-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Django==5.2.5' 'fpdf2==2.8.4'
      - name: Validate Windows installer PowerShell syntax and encoding
        shell: pwsh
        run: |
          $scriptPath = "scripts/install_accounting_test.ps1"
          $content = [System.IO.File]::ReadAllText((Resolve-Path $scriptPath).Path)
          if ($content.ToCharArray() | Where-Object { [int]$_ -gt 127 }) {
            throw "Installer must contain ASCII characters only for Windows PowerShell 5.1 compatibility."
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $scriptPath).Path, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw "Installer has PowerShell syntax errors."
          }
      - name: Check accounting configuration
        run: python manage.py check --settings=config.settings_accounting_ci
      - name: Verify receipt/contact migrations match models
        run: python manage.py makemigrations accounting_contacts accounting_imports accounting_profile --check --dry-run --settings=config.settings_accounting_ci
      - name: Run complete accounting test suite
        run: python manage.py test accounting accounting_contacts accounting_imports accounting_profile --settings=config.settings_accounting_ci --verbosity 2
